<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FastReply</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      body {
        max-width: 380px;
        margin: 0 auto;
        min-height: 100vh;
        border-left: 1px solid var(--line);
        border-right: 1px solid var(--line);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="brand">FastReply</p>
          <p class="tag">Resume send from the job tab</p>
        </div>
        <button id="account-btn" class="account" hidden></button>
      </header>

      <div id="banner" class="banner" hidden></div>

      <nav class="tabs" role="tablist" aria-label="FastReply sections">
        <button id="tab-compose" class="tab is-active" role="tab" aria-selected="true">
          Compose
        </button>
        <button id="tab-profile" class="tab" role="tab" aria-selected="false">Profile</button>
        <button id="tab-log" class="tab" role="tab" aria-selected="false">Sent</button>
      </nav>

      <main id="main" class="main">
        <section class="hero card">
          <h1>Connect Gmail to send</h1>
          <p class="lede">
            FastReply sends from one Gmail account with your resume attached. Paste
            the recruiter email from the job post — we do not scrape LinkedIn.
          </p>
          <p class="hint">Loading…</p>
        </section>
      </main>
    </div>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
